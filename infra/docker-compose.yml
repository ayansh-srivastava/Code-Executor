services:
  api_gateway:
    build:
      context: ../src
      dockerfile: services/api_gateway/Dockerfile
    image: api_gateway:latest
    ports:
      - "8080:8080"
    volumes:
      - ../src:/app
    environment:
      - PYTHONPATH=/app
  code_execution:
    build:
      context: ../src
      dockerfile: services/code_execution/Dockerfile
    image: code_execution:latest
    ports:
      - "50051:50051"
    volumes:
      - ../src:/app
    environment:
      - PYTHONPATH=/app
  piston_engine:
    image: ghcr.io/engineer-man/piston:latest
    container_name: piston_backend_engine
    restart: always
    privileged: true
    ports:
      - "2000:2000"
    volumes:
      - piston_data:/piston/data

volumes:
  piston_data:
